name: CI

on:
  pull_request:
    branches: [main]
  push:

jobs:
  regression:
    name: Regression tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mashtal_test
          POSTGRES_USER: mashtal_test
          POSTGRES_PASSWORD: ci-only-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mashtal_test -d mashtal_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://mashtal_test:ci-only-database-password@localhost:5432/mashtal_test?schema=public
      JWT_ACCESS_SECRET: ci-only-jwt-secret-32-characters-minimum-2026
      COOKIE_SECURE: "false"
      SEED_ADMIN_EMAIL: owner@ci.test
      SEED_ADMIN_PASSWORD: ci-only-owner-password-2026
      SEED_VIEWER_EMAIL: viewer@ci.test
      SEED_VIEWER_PASSWORD: ci-only-viewer-password-2026
      API_BASE_URL: http://127.0.0.1:3000/api
      TEST_ADMIN_EMAIL: owner@ci.test
      TEST_ADMIN_PASSWORD: ci-only-owner-password-2026
      TEST_VIEWER_EMAIL: viewer@ci.test
      TEST_VIEWER_PASSWORD: ci-only-viewer-password-2026
      ALLOW_TEST_DATA_MUTATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:unit
      - run: npm run api:build
      - run: npm run build
      - name: Run API end-to-end tests
        run: |
          node apps/api/dist/main.js > /tmp/mashtal-api.log 2>&1 &
          api_pid=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$API_BASE_URL/health" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/mashtal-api.log
              exit 1
            fi
            sleep 2
          done
          npm run test:e2e
          kill "$api_pid"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  publish-images:
    name: Publish production images
    needs: regression
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Publish API runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: true
          tags: ghcr.io/${{ github.repository }}-api:${{ github.sha }}
      - name: Publish migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migration
          push: true
          tags: ghcr.io/${{ github.repository }}-migration:${{ github.sha }}
      - name: Publish web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: true
          tags: ghcr.io/${{ github.repository }}-web:${{ github.sha }}

  deploy-production:
    name: Deploy production
    needs: publish-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
    env:
      PRODUCTION_HOST: ${{ vars.PRODUCTION_HOST }}
      PRODUCTION_USER: ${{ vars.PRODUCTION_USER }}
      PRODUCTION_DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
      PRODUCTION_GHCR_USER: ${{ vars.PRODUCTION_GHCR_USER }}
      PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
      PRODUCTION_GHCR_TOKEN: ${{ secrets.PRODUCTION_GHCR_TOKEN }}
      API_IMAGE: ghcr.io/${{ github.repository }}-api:${{ github.sha }}
      MIGRATION_IMAGE: ghcr.io/${{ github.repository }}-migration:${{ github.sha }}
      WEB_IMAGE: ghcr.io/${{ github.repository }}-web:${{ github.sha }}
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate production deployment settings
        run: |
          test -n "$PRODUCTION_HOST" || { echo "Set production variable PRODUCTION_HOST"; exit 1; }
          test -n "$PRODUCTION_USER" || { echo "Set production variable PRODUCTION_USER"; exit 1; }
          test -n "$PRODUCTION_DEPLOY_PATH" || { echo "Set production variable PRODUCTION_DEPLOY_PATH"; exit 1; }
          test -n "$PRODUCTION_GHCR_USER" || { echo "Set production variable PRODUCTION_GHCR_USER"; exit 1; }
          test -n "$PRODUCTION_SSH_PRIVATE_KEY" || { echo "Set production secret PRODUCTION_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$PRODUCTION_KNOWN_HOSTS" || { echo "Set production secret PRODUCTION_KNOWN_HOSTS"; exit 1; }
          test -n "$PRODUCTION_GHCR_TOKEN" || { echo "Set production secret PRODUCTION_GHCR_TOKEN"; exit 1; }
          [[ "$PRODUCTION_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "PRODUCTION_HOST must be a DNS name or IPv4 address"; exit 1; }
          [[ "$PRODUCTION_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "PRODUCTION_USER is invalid"; exit 1; }
          [[ "$PRODUCTION_GHCR_USER" =~ ^[A-Za-z0-9-]+$ ]] || { echo "PRODUCTION_GHCR_USER is invalid"; exit 1; }
          [[ "$PRODUCTION_DEPLOY_PATH" =~ ^/[A-Za-z0-9_./-]+$ && ! "$PRODUCTION_DEPLOY_PATH" =~ (^|/)\.\.(/|$) ]] || {
            echo "PRODUCTION_DEPLOY_PATH must be an absolute path without parent-directory segments"
            exit 1
          }
      - name: Configure SSH
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Log in to the registry on the VPS
        run: |
          printf '%s' "$PRODUCTION_GHCR_TOKEN" |
            ssh -o BatchMode=yes "$PRODUCTION_USER@$PRODUCTION_HOST" \
              "docker login ghcr.io --username '$PRODUCTION_GHCR_USER' --password-stdin"
      - name: Upload Compose configuration
        run: |
          scp -o BatchMode=yes compose.yaml \
            "$PRODUCTION_USER@$PRODUCTION_HOST:$PRODUCTION_DEPLOY_PATH/compose.yaml"
      - name: Back up, migrate, and deploy
        run: |
          ssh -o BatchMode=yes "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "DEPLOY_PATH='$PRODUCTION_DEPLOY_PATH' API_IMAGE='$API_IMAGE' MIGRATION_IMAGE='$MIGRATION_IMAGE' WEB_IMAGE='$WEB_IMAGE' DEPLOY_SHA='$DEPLOY_SHA' bash -se" <<'REMOTE'
          set -euo pipefail
            umask 077
            cd "$DEPLOY_PATH"
          docker compose config --quiet
          export API_IMAGE MIGRATION_IMAGE WEB_IMAGE
          docker compose pull api migrate web
          mkdir -p backups
          chmod 700 backups
          docker compose exec -T db sh -lc 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' \
            | gzip > "backups/pre-deploy-${DEPLOY_SHA}.sql.gz"
          test -s "backups/pre-deploy-${DEPLOY_SHA}.sql.gz"
          docker compose run --rm migrate
          docker compose up --detach --no-build --wait api web
          docker compose ps
          REMOTE
      - name: Remove registry credentials from the VPS
        if: always()
        run: |
          ssh -o BatchMode=yes "$PRODUCTION_USER@$PRODUCTION_HOST" \
            'docker logout ghcr.io' || true

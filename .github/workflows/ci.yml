name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  regression:
    name: Regression tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mashtal_test
          POSTGRES_USER: mashtal_test
          POSTGRES_PASSWORD: ci-only-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mashtal_test -d mashtal_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://mashtal_test:ci-only-database-password@localhost:5432/mashtal_test?schema=public
      JWT_ACCESS_SECRET: ci-only-jwt-secret-32-characters-minimum-2026
      COOKIE_SECURE: "false"
      SEED_ADMIN_EMAIL: owner@ci.test
      SEED_ADMIN_PASSWORD: ci-only-owner-password-2026
      API_BASE_URL: http://127.0.0.1:3000/api
      TEST_ADMIN_EMAIL: owner@ci.test
      TEST_ADMIN_PASSWORD: ci-only-owner-password-2026
      ALLOW_TEST_DATA_MUTATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:unit
      - run: npm run api:build
      - run: npm run build
      - name: Run API end-to-end tests
        run: |
          node apps/api/dist/main.js > /tmp/mashtal-api.log 2>&1 &
          api_pid=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$API_BASE_URL/health" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/mashtal-api.log
              exit 1
            fi
            sleep 2
          done
          npm run test:e2e
          kill "$api_pid"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
